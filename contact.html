      FitLife Gym

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>

  <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>

<section class="py-5">
  <div class="container">
    <h1 class="section-title text-center mb-4">Get in Touch</h1>
    <div class="row g-4">
      <div class="col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <form onsubmit="event.preventDefault(); this.reset(); alert('Thanks! We will reach out soon.');">
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input class="form-control" type="text" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Phone</label>
                <input class="form-control" type="tel" pattern="[0-9]{10}" placeholder="10-digit number" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="4" required></textarea>
              </div>
              <div class="d-grid"><button class="btn btn-primary" type="submit">Send Message</button></div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <h5 class="fw-bold">Address</h5>
        <p>123 Fitness Street, Andheri, Mumbai, India</p>
        <h5 class="fw-bold">Phone</h5>
        <p>+91 98765 43210</p>
        <h5 class="fw-bold">Email</h5>
        <p>info@fitlifegym.com</p>
        <div class="ratio ratio-16x9 mt-3">
          <iframe src="https://maps.google.com/maps?q=Mumbai&t=&z=12&ie=UTF8&iwloc=&output=embed" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer py-4"><div class="container text-center">Follow-ups in 24 hours (Mon–Sat).</div></footer>
